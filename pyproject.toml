[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsjepa"
version = "0.1.0"
description = "Neuro-Symbolic JEPA Advisor (Proposal 2): JEPA grounding + symbolic reasoning"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "rdflib>=7",          # KG + PROV-O
  "networkx>=3",        # SCM DAG + traversals
]

[project.optional-dependencies]
ml = ["torch>=2.2", "numpy>=1.26"]     # encoder backbone + SIGReg/VICReg
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
nsjepa = "services.cli.main:main"

[tool.setuptools.packages.find]
# Setuptools flat-layout autodiscovery refuses to guess once there is more than
# one candidate top-level directory, and this repo has seven. Naming them is the
# whole fix; the reason it needs BOTH lists is that three of the seven are not
# Python at all and one is a different distribution:
#
#   sdk/      the `nsjepa-contrib` distribution, with its own pyproject. Bundling
#             it into the `nsjepa` wheel would ship two packages under one name
#             and install a vendor-facing CLI on every engine install.
#   contrib/  vendor-submitted YAML. Data, not code, and untrusted until ratified.
#   eval/     baselines and fixtures.
#   training/ checkpoint and data placeholders.
#
# `exclude` is redundant against `include` today and is kept deliberately: a new
# top-level directory added later is silently picked up by neither, and an
# explicit refusal is the thing that will still be readable when that happens.
include = ["core*", "domains*", "services*"]
exclude = ["sdk*", "contrib*", "eval*", "training*", "tools*", "tests*", "docs*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# `sdk/` is a SEPARATE distribution (nsjepa-contrib) with its own pyproject and
# its own CI job. Without this, a bare `pytest -q` at the root collects
# sdk/tests, fails to import nsjepa_contrib, and dies during collection — which
# the root `test` job would hit the moment the install below starts working.
testpaths = ["tests"]
