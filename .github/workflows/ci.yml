name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
  audit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      # Deployment gate: every emitted recommendation must carry a complete
      # warrant chain + provenance. This job fails the build if any audit
      # trace in eval/audit_traces is missing a warrant or a provenance record.
      - run: pytest tests/integration -k audit -q
