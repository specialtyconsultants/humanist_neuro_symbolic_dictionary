ethics:
  principle_polarity: {autonomy: "-", justice: "-", non_maleficence: "+/-"}
  warrants: []
  # ^ NO MATCHING WARRANT IN norms/rules.yaml. The norms engine must not
  #   manufacture permissibility. Escalate for a human normative decision.
  balancing_note: >
    institutions assert that withholding during an open investigation prevents
    premature or incorrect statements (an accuracy claim under beneficence).
    That claim is not currently warranted by any rule in the domain norm set,
    hence non_maleficence is recorded as mixed rather than resolved. The justice
    polarity is negative at BOTH scales: the individual is denied recourse, and
    the patient population is denied the pattern evidence that would let a harm
    be recognised as structural rather than idiosyncratic.
